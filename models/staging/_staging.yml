models:
  - name: stg_restaurants
    columns:
      - name: restaurant_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full Service', 'Fine Dining', 'Fast Food']
  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null